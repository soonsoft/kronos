server:
  port: 8080
  servlet:
    encoding:
      charset: utf-8
      enabled: true
      force: true
spring:
  application:
      name: WebAPIApplication
  profiles:
    # 指定当前配置环境
    active: dev
  web: 
    resources:
      # 配置静态资源路径，可以通过file来配置jar包外部的路径："- file:D:/xxx/static/"
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
logging:
  config: classpath:config/logback.xml

